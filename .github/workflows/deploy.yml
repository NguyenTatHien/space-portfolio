name: Build and publish image

# Mỗi lần push lên main: build ảnh Docker rồi đẩy lên GHCR.
# VPS chạy Watchtower (xem deploy/docker-compose.yml) nên tự kéo ảnh mới về và khởi động lại container.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nguyentathien/space-portfolio:latest
            ghcr.io/nguyentathien/space-portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
